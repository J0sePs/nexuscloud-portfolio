name: ADR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/adr/**'

permissions:
  contents: read

jobs:
  adr-structure:
    name: ADR Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate ADR file naming
        run: |
          for f in docs/adr/[0-9]*.md; do
            basename=$(basename "$f")
            if [[ ! "$basename" =~ ^[0-9]{4}-[a-z0-9-]+\.md$ ]]; then
              echo "❌ Invalid ADR filename: $basename"
              echo "   Expected format: NNNN-short-slug.md (lowercase, hyphens)"
              exit 1
            fi
            echo "✅ $basename"
          done

      - name: Validate ADR required sections
        run: |
          REQUIRED_SECTIONS=(
            "## Context and Problem Statement"
            "## Decision Drivers"
            "## Considered Options"
            "## Decision Outcome"
            "## Pros and Cons of the Options"
            "## More Information"
          )

          for f in docs/adr/[0-9]*.md; do
            # Skip template
            if [[ "$(basename "$f")" == "0000-template.md" ]]; then
              continue
            fi
            echo "→ Checking $(basename "$f")"
            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -qF "$section" "$f"; then
                echo "  ❌ Missing section: $section"
                exit 1
              fi
            done
            echo "  ✅ All required sections present"
          done

      - name: Validate ADR metadata
        run: |
          for f in docs/adr/[0-9]*.md; do
            if [[ "$(basename "$f")" == "0000-template.md" ]]; then
              continue
            fi
            # Check for required metadata fields
            for field in "Status:" "Date:" "Deciders:" "Tags:"; do
              if ! grep -q "\*\*$field\*\*" "$f"; then
                echo "❌ $(basename "$f") missing metadata field: $field"
                exit 1
              fi
            done
            echo "✅ $(basename "$f") — metadata OK"
          done

      - name: Check ADR-INDEX is updated
        run: |
          # Every ADR file (excluding template) should appear in INDEX.md
          for f in docs/adr/[0-9]*.md; do
            basename=$(basename "$f")
            if [[ "$basename" == "0000-template.md" ]]; then
              continue
            fi
            if ! grep -qF "$basename" docs/adr/INDEX.md; then
              echo "❌ $basename is not listed in docs/adr/INDEX.md"
              exit 1
            fi
          done
          echo "✅ INDEX.md is up to date"

  adr-summary:
    name: ADR Summary Report
    runs-on: ubuntu-latest
    needs: adr-structure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "## 📚 ADR Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          count=$(ls docs/adr/[0-9]*.md 2>/dev/null | grep -v '0000-' | wc -l)
          echo "**Total accepted ADRs:** $count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Title |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          for f in docs/adr/[0-9]*.md; do
            if [[ "$(basename "$f")" == "0000-template.md" ]]; then
              continue
            fi
            title=$(head -1 "$f" | sed 's/^# //')
            echo "| \`$(basename "$f")\` | $title |" >> $GITHUB_STEP_SUMMARY
          done
