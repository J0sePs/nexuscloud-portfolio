global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    cluster: nexuscloud-lab

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Services will register themselves here in future sprints
  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    # This target will fail until Sprint 03; that's expected
